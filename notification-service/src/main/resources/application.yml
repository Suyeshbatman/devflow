server:
  port: 8086

spring:
  application:
    name: notification-service

  data:
    redis:
      host: localhost
      port: 6379
      password: devflow123
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # CRITICAL: different group-id from analytics-service
      # Each consumer group gets its OWN copy of every message
      # analytics-group gets the event AND notification-group gets it
      # Same message delivered to BOTH groups independently
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.devflow.notification.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.devflow.notification.dto.OrderEventDto

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.devflow: INFO
    org.springframework.kafka: INFO